name: "Suspicious Role Assignment or Elevation"
description: |
  Detects creation of high-privilege roles (Owner, Global Administrator).
severity: High
enabled: true
query: |
  AzureActivity
  | where OperationNameValue in~ ("MICROSOFT.AUTHORIZATION/ROLEASSIGNMENTS/WRITE",
                                  "MICROSOFT.AAD/DIRECTORYROLES/ROLEASSIGNMENT/WRITE")
  | where ActivityStatusValue == "Success"
  | where Properties_d.value has_any ("Owner", "Global Administrator")
  | project TimeGenerated, Caller, ResourceGroup, Resource, Properties_d
queryFrequency: 1h
queryPeriod: 24h
triggerOperator: GreaterThan
triggerThreshold: 0
suppressionDuration: 1h
suppressionEnabled: false
eventGroupingSettings:
  aggregationKind: SingleAlert
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Caller
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: Resource
tactics:
  - PrivilegeEscalation
techniques:
  - T1098
  - T1098.003
